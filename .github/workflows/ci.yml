name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: the game has zero runtime dependencies, and pulling Electron into
      # CI to prove nothing is how a repo starts failing on a network flake.
      - name: Syntax check every source
        run: npm run check
      # The real gate: every generated board must have one solution and be reachable by
      # pencil logic. This is a plain Node test, so it guards merges without a browser.
      - name: Engine tests
        run: node tools/engine-test.mjs

      # The ladder is a promise, not a caption: `TIERS[].band` is a selection target, and this
      # step goes red if a tier stops landing in its own band or the medians stop ordering.
      - name: Difficulty ladder is still measured
        run: node tools/balance.mjs
        env:
          SAMPLES: "24"

      # 坏存档不体现在像素上：浏览器闸采样画布，它分辨不出"一条手改的记录带走了整份存档"。
      # 所以这份定罪放在无浏览器的 check job 里，68 条断言全是纯 Node。
      - name: Save decode gate (one bad record drops only itself)
        run: node tools/save_gate.mjs

      # 命中映射只在"画布被 CSS 缩放过"时才暴露错位，而无头浏览器按固定 900×900 视口跑，
      # 永远缩不到那个比例 —— 浏览器闸对它是盲的。所以 125 次逐格点击放在纯 Node 里定罪。
      - name: Pointer hit-test gate (no 点 A 打 B under CSS scaling)
        run: node tools/hit_gate.mjs

      # 官方帧率探针用 vm.runInContext 装载，解析不了本仓的 ESM import，对本仓只能判
      # "无法比对"。这一步把"帧率无关"从一句注释变成断言，并自带阴性对照：
      # 变异 accum += dt → accum += 1/60 后必须变红，否则说明尺子是空跑的。
      - name: Frame-rate gate (fixed step + built-in negative control)
        run: node tools/frame_gate.mjs

      - name: Entry files exist
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html
      # 部署集闸：按 tools/assemble-site.sh 那份清单真拷一遍产物，要求页面会去要的东西
      # 都在里面。这一仓曾经因为清单落后于页面而线上 404 自己的 manifest/sw.js/图标，
      # 而本地一切全绿——因为本地根本没有「按清单拷」这一步。
      - name: Deploy set gate
        run: node tools/deploy-set.mjs
      # 阴性自证：每一类断言当场被打红一次，闸必须点名吃掉那一刀；写在注释里的假路径
      # 必须不算引用。钉住的条数由这一跑证明它真的会红，不是由记性证明。
      - name: Deploy set gate proves it can fail
        run: node tools/deploy-set-selftest.mjs

      # 图标类交付最容易注水成"仓里躺着一张 1024 PNG，而 index.html 还指着 data-URI 的 SVG"，
      # 或者 manifest 写了 icons 而文件没提交。这一步把两种都判红：每条同源引用必须解析到
      # 真实文件，每个 PNG 读 IHDR 与声明尺寸对账。只用标准库，runner 上不保证有 Pillow。
      - name: Asset references resolve to real PNGs
        run: python3 tools/asset_gate.py

  # 真浏览器闸：headless Chrome + CDP，读 DOM 文本/几何与画布像素，不读内部标志位。
  # 独立 job，node 22 而不是 check job 的 20：台架是裸 CDP 驱动，用的是 Node 22 才有的全局
  # WebSocket/fetch；在 20 上第一次 attach 就死在 "WebSocket is not defined"，一条断言都跑不到。
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 295 项浏览器断言（10 个场景 engine gen play hint stroke conflict save resume layout hud）在两种 URL 形态下的条数逐条相同，
      # 是 2026-10-04 在本机把两种形态各跑一遍量出来的（两份日志各 10 组、各 295 条，root 形态见 README 那一块），
      # 不是引用。在这一步之前 CI 一步都没跑过 tools/verify.sh：闸是写了给人看的，不是给人跑的。
      - name: Browser gate, root shape
        env:
          WD_TIMEOUT: 900
        run: bash tools/verify.sh

      # Pages 把这个仓发在 /z-biz-game-slant-cos/ 之下，而根形态的服务方式分辨不出斜杠开头的 import——
      # 同组织已经因此红过一次（部署站上 404，本地闸全绿）。所以前缀形态也是闸的一部分。
      - name: Browser gate, prefix shape (how Pages serves us)
        env:
          WD_TIMEOUT: 900
        run: |
          root=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE" "$root/z-biz-game-slant-cos"
          python3 -m http.server 5501 --bind 127.0.0.1 --directory "$root" &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null' EXIT
          for i in $(seq 1 40); do
            curl -fsS -m 2 "http://127.0.0.1:5501/z-biz-game-slant-cos/" >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS -m 3 "http://127.0.0.1:5501/z-biz-game-slant-cos/js/main.js" >/dev/null
          curl -fsS -m 3 "http://127.0.0.1:5501/z-biz-game-slant-cos/js/engine/count.js" >/dev/null
          BASE_URL=http://127.0.0.1:5501/z-biz-game-slant-cos/ bash tools/verify.sh
