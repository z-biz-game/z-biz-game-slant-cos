name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler: the game ships plain ES modules, so the site is a file copy.
      # 路径显式列出而不是 `cp -r .`：那样会把 server、electron 壳、harness、文档和
      # node_modules 一起塞进产物。index.html 现在引用 manifest / sw.js / assets 下的位图，
      # 少拷一个就是线上 404 —— 而本地闸照样全绿，所以这里补两条 test -f 当闸。
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js assets _site/
          test -f _site/assets/icons/icon-512.png
          test -f _site/assets/og/og-image.png
          test -f _site/assets/fx/spark-amber.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
